name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Imagem Linux com as ferramentas e as amostras
        run: |
          sudo bash pages/imagem/construir.sh
          sudo chown -R "$USER" pages/saida
      # Sem a copia do codigo-fonte no ar, o site novo nao sai.
      - name: Copia do codigo-fonte na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=GH_TOKEN,GITHUB_REPOSITORY bash pages/imagem/fontes.sh
      - name: Site e estado do Linux ja ligado
        working-directory: pages
        run: |
          npm ci
          python3 gerar_site.py
          node gerar_estado.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/saida/site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
